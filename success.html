<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>결제 확인 중</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{background:#1E2550;color:#F6F3EA;font-family:"Noto Sans KR",system-ui,sans-serif;
 min-height:100dvh;display:grid;place-items:center;padding:24px;margin:0;text-align:center}
.box{max-width:420px}
h1{font-family:"Noto Serif KR",serif;font-weight:700;font-size:26px;margin:0 0 14px}
p{color:#C2C7DE;line-height:1.85;font-size:15px;margin:0 0 10px}
.err{color:#E08A82}
a.btn{display:inline-block;margin-top:24px;padding:15px 28px;background:#EBD69F;color:#1E2550;
 border-radius:2px;text-decoration:none;font-family:"Noto Serif KR",serif;font-weight:700}
.sp{width:34px;height:34px;border:2px solid #4E588F;border-top-color:#EBD69F;border-radius:50%;
 margin:0 auto 22px;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style></head><body>
<div class="box" id="box">
  <div class="sp"></div>
  <h1>결제를 확인하고 있습니다</h1>
  <p>창을 닫지 말고 잠시만 기다려주세요.</p>
</div>
<script src="/pay.js"></script>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const back = p.get("from") || "/";
  const box = document.getElementById("box");
  try {
    const r = await Pay.confirm(p);
    box.innerHTML = `<h1>결제가 완료되었습니다</h1>
      <p>서른 가지 풀이가 모두 열렸습니다.<br>같은 브라우저에서는 다시 결제하지 않아도 계속 보실 수 있습니다.</p>
      <p style="font-size:13px;color:#8E95B2">주문번호 ${p.get("orderId")}</p>
      <a class="btn" href="${back}">풀이 보러 가기</a>`;
  } catch (e) {
    box.innerHTML = `<h1>승인에 실패했습니다</h1>
      <p class="err">${e.message}</p>
      <p>결제가 이뤄지지 않았다면 금액은 청구되지 않습니다.<br>같은 문제가 반복되면 고객센터로 알려주세요.</p>
      <a class="btn" href="${back}">돌아가기</a>`;
  }
})();
</script></body></html>
